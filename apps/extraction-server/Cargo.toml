[package]
name = "voxelize-extraction-server"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.93"

[lib]
name = "extraction_server"

[features]
default = []
engine = ["dep:voxelize"]

[dependencies]
actix-web = "=4.14.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
uuid = { version = "=1.23.4", features = ["serde", "v4"] }
voxelize = { path = "../..", optional = true }
