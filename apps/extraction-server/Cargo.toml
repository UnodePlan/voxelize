[package]
name = "voxelize-extraction-server"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.93"

[lib]
name = "extraction_server"

[features]
default = []
engine = ["dep:actix", "dep:specs", "dep:voxelize"]
db-tests = []
e2e-control = []

[dependencies]
actix = { version = "=0.13.5", optional = true }
actix-cors = "=0.7.1"
actix-web = "=4.14.0"
alloy = { version = "=1.8.3", features = ["network", "provider-http", "rpc-types", "sol-types"] }
async-trait = "=0.1.89"
getrandom = "=0.4.3"
hex = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
signinwithethereum = { version = "=0.8.1", features = ["alloy"] }
specs = { version = "=0.20.0", optional = true }
sqlx = { version = "=0.8.6", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "time", "tls-rustls-ring", "uuid"] }
time = { version = "=0.3.53", features = ["formatting", "parsing", "serde"] }
tokio = { version = "=1.52.3", features = ["macros", "sync", "time"] }
uuid = { version = "=1.23.4", features = ["serde", "v4"] }
voxelize = { path = "../..", optional = true }
